name: Update GitHub Contribution Graph

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Activity Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: profile/github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sithumcha
          base: header, activity, community, repositories
          config_timezone: Asia/Colombo
          config_output: svg

      - name: Generate Languages Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: sithumcha
          base: ""
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-percentage, percentage
          config_timezone: Asia/Colombo
          config_output: svg
